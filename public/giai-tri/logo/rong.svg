<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Đảo Rồng">
  <defs>
    <linearGradient id="rn" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#5fdcc8"/><stop offset=".55" stop-color="#0e8f8b"/><stop offset="1" stop-color="#08494f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#rn)"/>

  <!--
    Rồng con nở ra từ trứng, chứ không phải một con rồng đứng thẳng.
    Đã thử ba lượt vẽ con rồng nhìn chính diện: đầu to kiểu chibi thì cánh
    không còn chỗ, mà thêm cánh với sừng vào thì ra con dơi hoặc con hươu.
    Quả trứng gánh phần bố cục, còn sừng với mõm chỉ cần làm điểm nhấn ở cỡ
    nhỏ — mà đây cũng đúng việc đầu tiên người chơi làm ở đảo này.
  -->

  <!-- ánh sáng sau trứng -->
  <circle cx="64" cy="74" r="42" fill="#ffffff" opacity=".12"/>

  <!-- nửa dưới quả trứng -->
  <path d="M28 82c0 20 16 34 36 34s36-14 36-34c0-6-1-12-3-18l-66 2c-2 5-3 11-3 16z" fill="#fdf6e3"/>
  <path d="M31 66c4 10 16 16 33 16s29-6 33-16l-66 0z" fill="#e8dcc0"/>
  <!-- vết vỏ vỡ răng cưa -->
  <path d="M28 68l9-8 6 8 7-9 6 9 8-10 7 10 7-9 6 9 8-8 8 8v6H28z" fill="#fdf6e3"/>
  <!-- đốm trên vỏ -->
  <ellipse cx="45" cy="94" rx="6" ry="4.5" fill="#f2c46b" opacity=".8"/>
  <ellipse cx="72" cy="102" rx="7" ry="5" fill="#f2c46b" opacity=".8"/>
  <ellipse cx="86" cy="86" rx="4.5" ry="3.5" fill="#f2c46b" opacity=".8"/>

  <!-- rồng con -->
  <path d="M43 34 33 17l15 8z" fill="#fff3d1"/>
  <path d="M85 34 95 17 80 25z" fill="#fff3d1"/>
  <ellipse cx="64" cy="50" rx="27" ry="25" fill="#f2a93b"/>
  <!-- mõm -->
  <ellipse cx="64" cy="65" rx="16" ry="11" fill="#ffe9b8"/>
  <ellipse cx="58" cy="62" rx="2" ry="1.5" fill="#a4681f"/>
  <ellipse cx="70" cy="62" rx="2" ry="1.5" fill="#a4681f"/>
  <path d="M56 68q8 7 16 0" fill="none" stroke="#a4681f" stroke-width="2.8" stroke-linecap="round"/>
  <!-- mắt -->
  <circle cx="53" cy="45" r="8.5" fill="#fff"/><circle cx="54" cy="46" r="5.8" fill="#2a1a06"/><circle cx="56.2" cy="43.4" r="2.3" fill="#fff"/>
  <circle cx="75" cy="45" r="8.5" fill="#fff"/><circle cx="76" cy="46" r="5.8" fill="#2a1a06"/><circle cx="78.2" cy="43.4" r="2.3" fill="#fff"/>
  <ellipse cx="42" cy="56" rx="5.5" ry="3.6" fill="#f47b7b" opacity=".75"/>
  <ellipse cx="86" cy="56" rx="5.5" ry="3.6" fill="#f47b7b" opacity=".75"/>

  <!-- lấp lánh -->
  <path d="M18 34l2.5 6 6 2.5-6 2.5L18 51l-2.5-6-6-2.5 6-2.5z" fill="#fff" opacity=".85"/>
  <path d="M107 58l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#fff" opacity=".7"/>
</svg>
