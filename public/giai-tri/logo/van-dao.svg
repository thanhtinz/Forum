<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Vạn Đạo Tu Tiên">
  <defs>
    <linearGradient id="vd" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#4a5568"/><stop offset=".5" stop-color="#232830"/><stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
  </defs>
  <!--
    CHỮ chứ không phải hình, và đó là chủ ý: đây là game chữ, mà nguyên tắc lõi
    của cả dòng bên Trung Quốc là 文字即界面. Ba logo kia là hình vẽ, riêng ô
    này là một con dấu.

    Đây là bản TẠM cho tới khi có bộ ảnh thật. Thay tệp này là xong, trang
    không phải sửa dòng nào.
  -->
  <rect width="128" height="128" fill="url(#vd)"/>
  <!-- vệt mây mực ngang, gợi núi trong sương -->
  <path d="M0 84c18-7 30 3 46-2s26-11 42-6 26 10 40 4v44H0z" fill="#000" opacity=".35"/>
  <path d="M0 98c16-6 28 2 44-2s28-8 44-4 24 8 40 3v33H0z" fill="#000" opacity=".3"/>
  <!-- con dấu son -->
  <rect x="26" y="20" width="76" height="76" rx="4" fill="#9d2933"/>
  <rect x="31" y="25" width="66" height="66" rx="2" fill="none" stroke="#f0dcc0" stroke-width="1.5" opacity=".75"/>
  <text x="64" y="52" text-anchor="middle" fill="#f7ecd8"
        font-family="'Noto Serif',Georgia,'Times New Roman',serif" font-size="30" font-weight="700">萬</text>
  <text x="64" y="84" text-anchor="middle" fill="#f7ecd8"
        font-family="'Noto Serif',Georgia,'Times New Roman',serif" font-size="30" font-weight="700">道</text>
</svg>
